name: Bi-Weekly Creator Intelligence Pipeline

on:
  # Runs on the 1st and 15th of every month at midnight UTC
  schedule:
    - cron: '0 0 1,15 * *'
  # Also allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-and-prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # ── 1. CHECK OUT REPO ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. SET UP NODE ─────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. INSTALL DEPENDENCIES ────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 4. RUN APIFY SCRAPERS + GOOGLE VISION OCR ──────────────────
      - name: Run scraper pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_VISION_KEY: ${{ secrets.GOOGLE_VISION_KEY }}
        run: node pipeline/scrape.js

      # ── 5. SAVE ENRICHED DATA FOR MANUAL CLAUDE ANALYSIS ───────────
      # scrape.js writes enriched-data.json to the repo root.
      # Paste its contents into Claude chat and run:
      #   "run weekly analysis"
      # Claude returns structured JSON — save it as analysis.json,
      # commit it, and Vercel auto-redeploys the dashboard.
      #
      # OPTIONAL: Uncomment the step below once you add your
      # Anthropic API key as a GitHub Secret (ANTHROPIC_API_KEY)
      # to make the analysis step fully automatic.

      # - name: Run Claude analysis (auto)
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: node pipeline/analyse.js

      # ── 6. COMMIT ENRICHED DATA ────────────────────────────────────
      - name: Commit enriched data to repo
        run: |
          git config --global user.name "CreatorIntel Bot"
          git config --global user.email "bot@creatorintel"
          git add enriched-data.json
          git diff --staged --quiet || git commit -m "Bi-weekly enriched data — $(date -u '+%Y-%m-%d')"
          git push
